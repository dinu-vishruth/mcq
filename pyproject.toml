[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` tests talk to a real provider/API and need credentials; they are opt-in.
addopts = "-ra -m 'not live'"
markers = [
    "live: requires real credentials or network access (run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "chroma_db",
    "frontend",
    "reports",
    "train",
]

[tool.ruff.lint]
# A deliberately small, actionable set. Line length is not enforced because the
# codebase has long explanatory comments by design; unused imports/undefined
# names/import order are the checks that actually catch regressions.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Test modules must point config at a temp DB before importing the app, so
# imports are intentionally not all at the top of the file.
"tests/*" = ["E402"]
