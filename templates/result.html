<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Results — MCQ Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/dist/app.css">
</head>

<body>
  {#
    React mount shell for results. The /submit route (core/routes/student.py) is
    UNCHANGED — it still scores, persists, runs learning analysis, and renders
    this template with score/total/details/explanations. React renders the
    analytics view (circular score, per-question review, explanations).
  #}
  <div id="root"
       data-page="result"
       data-bootstrap='{{ {
         "score": score,
         "total": total,
         "details": details,
         "explanations": explanations
       } | tojson }}'></div>

  <script type="module" src="/static/dist/app.js"></script>
</body>

</html>
