<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Journey — Examly</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/dist/app.css">
</head>

<body>
  {# React mount shell for the Learning Journey page. #}
  <div id="root"
       data-page="journey"
       data-bootstrap='{{ {
         "username": session.username or "there",
         "document_id": document_id | default(none),
         "title": title | default("")
       } | tojson }}'></div>
  <script type="module" src="/static/dist/app.js"></script>
</body>

</html>
