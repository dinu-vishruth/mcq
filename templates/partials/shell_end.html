{# Closes .main opened in partials/shell.html, plus shared shell JS. #}
</div><!-- /.main -->

<script>
  (function () {
    var sidebar = document.getElementById('app-sidebar');
    var toggle = document.getElementById('sidebar-toggle');
    var backdrop = document.getElementById('sidebar-backdrop');
    if (!sidebar || !toggle) return;
    function open() { sidebar.classList.add('open'); backdrop && backdrop.classList.add('show'); }
    function close() { sidebar.classList.remove('open'); backdrop && backdrop.classList.remove('show'); }
    toggle.addEventListener('click', function () {
      sidebar.classList.contains('open') ? close() : open();
    });
    backdrop && backdrop.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  })();
</script>
