<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Confirm account</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/css/style.css"></head><body class="utility-page"><main class="utility-card"><a class="utility-brand" href="/">Examly</a>
<h1>Confirm your account request</h1>{% if notice %}<p role="status">{{ notice }}</p>{% endif %}
{% if token %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="token" value="{{ token }}"><label>New password for password recovery <input type="password" name="password" minlength="{{ password_min_length }}" maxlength="{{ password_max_length }}" autocomplete="new-password" aria-describedby="password-requirements"></label><p id="password-requirements">{{ password_help }}</p><p>Leave the password blank when verifying an email.</p><button>Confirm</button></form>{% endif %}
<a href="/">Sign in</a></main></body></html>
