<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Set Created — MCQ Generator</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/dist/app.css">
</head>

<body>
  {#
    React mount shell. The /upload route renders this with session_key + mcqs
    after a successful generation. Route is UNCHANGED.
  #}
  <div id="root"
       data-page="report"
       data-bootstrap='{{ {
         "session_key": session_key,
         "mcqs": mcqs
       } | tojson }}'></div>

  <script type="module" src="/static/dist/app.js"></script>
</body>

</html>
