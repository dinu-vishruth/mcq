name: Production release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_JJ49mOKZW1602o9zHPrm6tBU
      VERCEL_PROJECT_ID: prj_5xlaDCRhZkfSCTlgVoeEHwuRbvMo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require deployment credential
        run: test -n "$VERCEL_TOKEN" || { echo 'Configure the production VERCEL_TOKEN secret.'; exit 1; }
      - name: Reject superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$RELEASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build tested frontend source
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: npm install --global vercel@58.7.1
      - name: Deploy tested commit
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
      - name: Check production readiness
        run: |
          curl --fail --retry 3 --retry-delay 5 --max-time 60 https://mcq-silk.vercel.app/healthz
          curl --fail --retry 3 --retry-delay 5 --max-time 60 https://mcq-silk.vercel.app/readyz
