name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Deterministic, offline test backends. No provider key is set, so no test
      # can accidentally reach a real LLM; `live` tests are deselected by the
      # pytest config unless explicitly requested.
      EMBEDDING_BACKEND: hashing
      VECTOR_STORE: sqlite
      SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: examly_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: examly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U examly_test -d examly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ''
      POSTGRES_URL: ''
      MCQ_TEST_DATABASE_URL: postgresql://examly_test:isolated-ci-password@localhost:5432/examly_test
      SECRET_KEY: isolated-ci-session-key
      EMBEDDING_BACKEND: hashing
      VECTOR_STORE: sqlite
      SEED_DEMO_USERS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_shared_library.py tests/test_postgres_reliability.py
