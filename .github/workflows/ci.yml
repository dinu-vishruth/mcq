name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Deterministic, offline test backends. No provider key is set, so no test
      # can accidentally reach a real LLM; `live` tests are deselected by the
      # pytest config unless explicitly requested.
      EMBEDDING_BACKEND: hashing
      VECTOR_STORE: sqlite
      SEED_DEMO_USERS: "0"
      SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build committed assets
        run: npm run build
      - name: Verify committed assets are current
        working-directory: .
        run: |
          git diff --exit-code -- static/dist
          if [ -n "$(git ls-files --others --exclude-standard static/dist)" ]; then
            echo "The build produced uncommitted static/dist files."
            exit 1
          fi
