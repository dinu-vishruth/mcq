name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Deterministic, offline test backends. No provider key is set, so no test
      # can accidentally reach a real LLM; `live` tests are deselected by the
      # pytest config unless explicitly requested.
      EMBEDDING_BACKEND: hashing
      VECTOR_STORE: sqlite
      SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q
